name: Aggiorna risultati partite
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 13,15,17,19,21,23 * * 0,6"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/update-match-results.mjs
